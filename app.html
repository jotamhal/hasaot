<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>לוח ההסעות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef1f5; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e3e7ee;
  --kid:#2563eb; --drive:#ea580c; --drive-soft:#fff0e6;
  --ok:#15803d; --ok-soft:#e6f4ea;
  --bad:#dc2626; --bad-soft:#fdeaea;
  --none:#9aa3af; --none-soft:#f1f3f7;
  --r:18px;
}
html,body{margin:0;padding:0;direction:rtl;background:var(--bg);color:var(--ink);
  font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.demo{background:#fef3c7;border:1px solid #fde68a;color:#78350f;border-radius:13px;
  padding:9px 12px;margin-bottom:12px;font-size:12.5px;font-weight:600;line-height:1.5}
body{overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

.top{display:flex;align-items:center;gap:10px;padding:14px 2px 10px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 72%,rgba(238,241,245,0));z-index:20}
.top h1{font-size:20px;font-weight:800;margin:0;flex:1;line-height:1.25}
.top h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:18px;flex:none;box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative}
.iconbtn .bdg{position:absolute;top:-4px;left:-4px;background:var(--bad);color:#fff;font-size:10px;
  font-weight:800;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

.nextup{background:#111827;color:#fff;border-radius:var(--r);padding:13px 15px;margin-bottom:16px}
.nextup .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#9ca3af;margin-bottom:5px}
.nextup .main{font-size:15px;font-weight:600;line-height:1.55}
.nextup .warn{color:#fca5a5;font-weight:700}

.board{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:12px;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,24,40,.05);display:flex;gap:13px;align-items:flex-start;width:100%;text-align:right}
.board .em{width:48px;height:48px;border-radius:14px;background:var(--none-soft);display:grid;place-items:center;font-size:24px;flex:none}
.board .bd{flex:1;min-width:0}
.board .nm{font-size:17px;font-weight:700}
.board .sub{font-size:13px;color:var(--muted);margin-top:3px}
.board .st{margin-top:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.none{background:var(--none-soft);color:#4b5563}
.addboard{width:100%;border:1.5px dashed #c7cedb;border-radius:var(--r);padding:15px;color:var(--muted);
  font-weight:600;font-size:14.5px;margin-top:4px}

.week{display:flex;align-items:center;gap:10px;margin:20px 2px 11px}
.week b{font-size:13px;font-weight:800}
.week span{font-size:12.5px;color:var(--muted)}
.week i{flex:1;height:1px;background:#dbe0e9}

.day{background:var(--card);border-radius:var(--r);border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:12px;overflow:hidden}
.dayhead{padding:10px 14px 9px}
.dh1{display:flex;align-items:center;gap:7px}
.dh2{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.dh2 b{font-weight:800;color:#4b5563}
.dh2 b.nop{color:var(--bad)}
.dayhead .dow{font-size:16px;font-weight:800}
.dayhead .dt{font-size:15px;font-weight:700;color:var(--muted);flex:1}
.day.off{opacity:.62}
.day.off .dh1 .dow,.day.off .dh1 .dt{text-decoration:line-through}
.dayhead .kebab{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#9aa3af;font-size:17px;flex:none}

/* ============ שני החצאים ============ */
.halves{display:flex;gap:8px;padding:0 10px 10px}
.half{flex:1;border-radius:14px;min-height:114px;border:1.5px solid var(--line);background:#fbfcfe;
  transition:transform .07s,background .13s,border-color .13s}
.half:active{transform:scale(.975)}
.sw2{width:36px;height:21px;border-radius:99px;background:#d7dde7;position:relative;flex:none;transition:background .16s}
.sw2::after{content:"";position:absolute;top:2.5px;right:2.5px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .17s}
.sw2.on::after{transform:translateX(-15px)}
.hcap{font-size:12.5px;font-weight:800;color:#8b94a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hval{font-size:15.5px;font-weight:800;color:#b3bac6;text-align:center;line-height:1.25}

/* --- חצי הילד --- */
.half.kid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px}
.half.kid.on{background:var(--kid);border-color:var(--kid);box-shadow:inset 0 2px 9px rgba(0,0,0,.17)}
.half.kid.on .hcap{color:rgba(255,255,255,.78)}
.half.kid.on .hval{color:#fff}
.half.kid.on .sw2{background:rgba(255,255,255,.42)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center}
.chip{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:#eef1f6;color:#aab1bd;border:1.5px solid transparent}
.chip.on{background:var(--kid);color:#fff}
.half.kid.on .chip{background:rgba(255,255,255,.22);color:rgba(255,255,255,.75)}
.half.kid.on .chip.on{background:#fff;color:var(--kid)}

/* --- חצי ההסעה: ימין גדול (און/אוף) + שמאל שני כפתורי כיוון --- */
.half.drive{flex:1.18;display:flex;flex-direction:row;align-items:stretch;gap:7px;padding:9px}
.half.drive .hval{font-size:14px;white-space:nowrap}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dlegs{width:54px;flex:none;display:flex;flex-direction:column;gap:6px}
.leg{flex:1;min-height:38px;display:grid;place-items:center;font-size:13px;font-weight:800;border-radius:10px;
  background:#eef1f6;color:#aab1bd;transition:background .13s,color .13s}
.seatnote{font-size:10.5px;font-weight:700;color:#98a2b3;text-align:center;line-height:1.3}
.half.drive.on{background:var(--drive);border-color:var(--drive);box-shadow:inset 0 2px 9px rgba(0,0,0,.17)}
.half.drive.on .hval{color:#fff}
.half.drive.on .sw2{background:rgba(255,255,255,.45)}
.half.drive.on .seatnote{color:rgba(255,255,255,.85)}
.half.drive.on .leg{background:rgba(255,255,255,.22);color:rgba(255,255,255,.72)}
.half.drive.on .leg.on{background:#fff;color:var(--drive)}

.strip{width:100%;display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--line);
  font-size:13.5px;font-weight:600;text-align:right}
.strip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.strip .txt{flex:1;line-height:1.45}
.strip .chev{color:#b6bdc9;font-size:12px;transition:transform .15s}
.day.open .strip .chev{transform:rotate(180deg)}
.strip.ok{background:var(--ok-soft);color:#14532d}.strip.ok .dot{background:var(--ok)}
.strip.bad{background:var(--bad-soft);color:#7f1d1d}.strip.bad .dot{background:var(--bad)}
.strip.none{background:var(--none-soft);color:#4b5563}.strip.none .dot{background:var(--none)}

.det{display:none;padding:4px 14px 14px;background:#f8fafc;border-top:1px solid var(--line)}
.day.open .det{display:block}
.legblock{padding:12px 0;border-bottom:1px dashed #dde3ec}
.legblock:last-of-type{border-bottom:0}
.legttl{font-size:12px;font-weight:800;letter-spacing:.04em;color:#6b7280;margin-bottom:9px}
.car{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.car .av{width:30px;height:30px;border-radius:50%;background:var(--drive-soft);color:var(--drive);
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.car.mine .av{background:var(--drive);color:#fff}
.car .cinfo{flex:1;min-width:0}
.car .cnm,.car .pax{display:block}
.car .cnm{font-size:14px;font-weight:700}
.car .cnm em{font-style:normal;font-weight:600;color:var(--muted);font-size:12.5px}
.car .pax{font-size:13px;color:#374151;margin-top:2px;line-height:1.5}
.car .pax b{font-weight:700;color:var(--kid)}
.car .pax i{font-style:normal;font-size:11.5px;color:#9aa3af;margin-right:3px}
.empty{color:var(--bad);font-size:13.5px;font-weight:700}
.wait{font-size:13px;color:#7f1d1d;background:var(--bad-soft);border-radius:11px;padding:9px 11px;margin-top:8px;line-height:1.5}
.unmarked{font-size:12.5px;color:#4b5563;background:#eef1f6;border-radius:11px;padding:9px 11px;margin-top:11px;line-height:1.5}
.shareb{width:100%;margin-top:12px;background:#111827;color:#fff;border-radius:13px;padding:12px;
  font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}

/* ============ גיליונות וחלוניות ============ */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:#dde3ec;margin:6px auto 12px}
.sh-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-back{width:32px;height:32px;border-radius:10px;background:#f1f3f7;display:grid;place-items:center;font-size:17px;flex:none;margin-top:2px}
.sh-tt{flex:1;min-width:0}
.sh-tt h3{margin:0;font-size:18px;font-weight:800}
.sh-tt div{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.row{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:right;font-size:15px}
.row:last-child{border-bottom:0}
.row .ic{width:26px;text-align:center;font-size:17px;flex:none;color:#6b7280}
.row .lb{flex:1;min-width:0}
.row .lb small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.45}
.row .rt{color:var(--muted);font-size:13.5px;font-weight:600;flex:none}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:#eef1f6;color:#4b5563;flex:none}
.tag.adm{background:#e8efff;color:var(--kid)}
.tag.warn{background:var(--bad-soft);color:var(--bad)}
.sw{width:46px;height:27px;border-radius:99px;background:#dde3ec;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .16s}
.sw.on{background:var(--kid)}
.sw.on::after{transform:translateX(-19px)}
.sw.on.amber{background:var(--drive)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:32px;height:32px;border-radius:10px;background:#f1f3f7;font-size:18px;font-weight:700;display:grid;place-items:center;color:#374151}
.step span{min-width:34px;text-align:center;font-size:16px;font-weight:800}
.pendttl{font-size:12px;font-weight:800;color:#92400e;margin:4px 0 2px}
.pend{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px;margin:8px 0}
.pend .pn{font-size:14.5px;font-weight:700}
.pend .ps{font-size:12.5px;color:#92400e;margin-top:2px;line-height:1.45}
.pend .pb{display:flex;gap:8px;margin-top:10px}
.pend .pb button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:700}
.pend .pb .yes{background:var(--ok);color:#fff}
.pend .pb .no{background:#f1f3f7;color:#4b5563}
.hint{font-size:12.5px;color:#4b5563;background:#eef1f6;border-radius:12px;padding:10px 12px;margin:2px 0 10px;line-height:1.55}

.modal{background:#fff;border-radius:20px;max-width:400px;width:calc(100% - 36px);padding:20px;margin:auto;animation:pop .16s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.scrim.center{align-items:center;padding:18px}
.modal h3{margin:0 0 8px;font-size:17.5px;font-weight:800}
.modal p{margin:0 0 14px;font-size:14.5px;color:#374151;line-height:1.6}
.wa{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:13.5px;
  line-height:1.65;white-space:pre-wrap;color:#1f2937;margin-bottom:14px}
.btns{display:flex;gap:9px}
.btn{flex:1;padding:13px;border-radius:13px;font-size:14.5px;font-weight:700;text-align:center}
.btn.p{background:#111827;color:#fff}.btn.g{background:#25d366;color:#fff}.btn.s{background:#f1f3f7;color:#374151}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#111827;color:#fff;padding:11px 18px;
  border-radius:999px;font-size:13.5px;font-weight:600;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.note{font-size:12px;color:#9aa3af;text-align:center;padding:18px 20px 4px;line-height:1.6}

/* ============ זרימת הצטרפות ============ */
.prog{display:flex;gap:5px;padding:2px 2px 16px}
.prog i{flex:1;height:3px;border-radius:2px;background:#dbe0e9}
.prog i.on{background:var(--kid)}
.fh{margin:0 2px 6px;font-size:23px;font-weight:800;line-height:1.25;text-wrap:balance}
.fs{margin:0 2px 20px;font-size:14.5px;color:var(--muted);line-height:1.6}
.field{margin-bottom:16px}
.flab{font-size:12.5px;font-weight:800;color:#6b7280;margin:0 2px 7px}
.inp{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;
  font:inherit;font-size:16px;font-weight:600;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--kid);box-shadow:0 0 0 3px #dbeafe}
.inp::placeholder{color:#b3bac6;font-weight:500}
.two{display:flex;gap:9px}
.two>*{flex:1;min-width:0}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pk{padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  font-size:14.5px;font-weight:700;color:#9aa3af;min-width:46px;text-align:center}
.pk.on{background:var(--kid);border-color:var(--kid);color:#fff}
.pk.em{font-size:21px;padding:8px 11px;min-width:0}
.pk.em.on{background:#dbeafe;border-color:var(--kid)}
.cta{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(238,241,245,0),var(--bg) 30%)}
.cta button{width:100%;background:var(--kid);color:#fff;border-radius:15px;padding:16px;font-size:16px;font-weight:800}
.cta button.off{background:#c8cfda}
.cta .alt{width:100%;text-align:center;padding:12px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.inv{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:18px}
.inv .av{width:54px;height:54px;border-radius:50%;background:var(--kid);color:#fff;font-size:22px;font-weight:800;
  display:grid;place-items:center;margin:0 auto 12px}
.inv .t{font-size:16px;font-weight:600;color:#374151;line-height:1.6}
.inv .t b{font-weight:800;color:var(--ink)}
.inv .meta{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.7}
.code{display:flex;gap:8px;direction:ltr;justify-content:center}
.code input{width:46px;height:56px;text-align:center;font-size:22px;font-weight:800;
  border:1.5px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}
.code input:focus{outline:none;border-color:var(--kid);box-shadow:0 0 0 3px #dbeafe}
.lonely{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r);padding:14px;margin-bottom:14px}
.lonely .lt{font-size:14.5px;font-weight:700;color:#78350f}
.lonely .ls{font-size:13px;color:#92400e;margin-top:4px;line-height:1.55}
.lonely button{width:100%;margin-top:11px;background:#111827;color:#fff;border-radius:12px;padding:11px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script type="module">
/* ===================== נתונים ===================== */
let ME='אני';   /* מתעדכן בטעינה */
const KIDS={};   /* שם ילד -> שם ההורה, נבנה בטעינה */
const DOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DOWL=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

/* מיקום המפגש — דרופדאון קבוע ועוד "אחר" בטקסט חופשי */
const PLACES=['רגבה','עברון','בית העמק'];

/* המפגש יורש מהחוג, אלא אם נערך במפורש. זו שכבת החריגים. */
const sStart=(a,s)=>s.start||a.start;
const sT1   =(a,s)=>minusMin(sStart(a,s), a.lead ?? 15);
const sT2   =(a,s)=>s.end||a.t2;
const sPlace=(a,s)=>s.place||a.place;
const changed=(a,s)=>[s.origDate&&'הועבר', (s.start||s.end)&&'שעה שונה',
                      false].filter(Boolean);

let state={car:{seats:3},household:[],kids:[],acts:[]};
let ME_ID=null;

/* שני שבועות קדימה, מיום ראשון של השבוע הנוכחי */
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dm  = d => d.getDate()+'.'+(d.getMonth()+1);
const WK0 = (()=>{ const t=new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate()-t.getDay()); return t; })();
const dayOf = n => { const d=new Date(WK0); d.setDate(WK0.getDate()+n); return d; };
const DATES = [[...Array(7)].map((_,i)=>dm(dayOf(i))), [...Array(7)].map((_,i)=>dm(dayOf(i+7)))];
const WEEKS = [
  {t:'השבוע',      r:dm(dayOf(0))+' – '+dm(dayOf(6))},
  {t:'בשבוע הבא',  r:dm(dayOf(7))+' – '+dm(dayOf(13))},
];

let view={screen:'home',actId:null,open:{}};

/* ===================== לוגיקה ===================== */
const act=()=>state.acts.find(a=>a.id===view.actId);
const actById=id=>state.acts.find(a=>a.id===id);
const sess=(aid,sid)=>actById(aid).sessions.find(s=>s.id===sid);
const pendingCount=()=>state.acts.reduce((n,a)=>n+a.pending.length,0);
/* משפחות בחוג: {n:שם, adm:מנהל} */
const memNames=a=>a.members.map(m=>m.n);
const isMem=(a,n)=>a.members.some(m=>m.n===n);
const mem=(a,n)=>a.members.find(m=>m.n===n);
const iAdmin=a=>!!(mem(a,ME)||{}).adm;
const adminCount=a=>a.members.filter(m=>m.adm).length;
const admLbl=n=>n===1?'מנהל אחד':n+' מנהלים';
const famLbl=n=>n===1?'משפחה אחת':n+' משפחות';

function driversFor(s,dir){
  const l=s.offers.filter(o=>o[dir]).map(o=>({by:o.by,seats:o.seats,mine:false}));
  if(s.mine[dir]) l.unshift({by:ME,seats:s.mine.seats,mine:true});
  return l;
}
/* מקומות = מקומות פנויים לילדים אחרים. הילדים של הנהג נוסעים איתו ולא נספרים. */
function assign(s,dir){
  const riders=Object.keys(s.att).filter(k=>s.att[k]);
  const cars=driversFor(s,dir).map(d=>({...d,cap:d.seats,pax:[],own:0}));
  const free=c=>c.cap-(c.pax.length-c.own);
  const left=[];
  riders.forEach(k=>{
    const own=cars.find(c=>c.by===KIDS[k]);
    if(own){ own.pax.push(k); own.own++; } else left.push(k);
  });
  left.slice().forEach(k=>{
    const c=cars.find(c=>free(c)>0);
    if(c){c.pax.push(k);left.splice(left.indexOf(k),1);}
  });
  cars.forEach(c=>c.free=free(c));
  return {cars,waiting:left,riders};
}
function legStatus(s,dir){
  const a=assign(s,dir);
  if(!a.riders.length) return {k:'none',a};
  if(!a.cars.length)   return {k:'bad',a,msg:'חסרה הסעה'};
  if(a.waiting.length) return {k:'bad',a,msg:'חסרים '+a.waiting.length+' מקומות'};
  return {k:'ok',a,msg:a.cars.map(c=>c.mine?'אני':c.by).join(', ')};
}
function dayStatus(s){
  const to=legStatus(s,'to'), fr=legStatus(s,'from');
  if(s.fresh&&!Object.keys(s.att).length) return {k:'none',txt:'עוד לא סומן',to,fr};
  const bad=[];
  if(to.k==='bad') bad.push('הלוך: '+to.msg);
  if(fr.k==='bad') bad.push('חזור: '+fr.msg);
  if(bad.length) return {k:'bad',txt:bad.join(' · '),to,fr};
  if(to.k==='none'&&fr.k==='none') return {k:'none',txt:'אין ילדים רשומים',to,fr};
  return {k:'ok',txt:'הלוך: '+to.msg+' · חזור: '+fr.msg,to,fr};
}
function actStatus(a){
  const now=a.sessions.filter(s=>s.week===0);
  const noPlace=now.filter(s=>!s.cancelled&&!sPlace(a,s));
  if(noPlace.length) return {k:'bad',txt:'מיקום לא נקבע ל'+noPlace.map(s=>'יום '+DOWL[s.dow]).join(', ')};
  const bad=now.filter(s=>dayStatus(s).k==='bad');
  if(bad.length) return {k:'bad',txt:'חסרה הסעה ל'+bad.map(s=>'יום '+DOWL[s.dow]).join(', ')};
  const none=now.filter(s=>dayStatus(s).k==='none');
  if(none.length) return {k:'none',txt:none.length+' ימים עוד לא סומנו'};
  return {k:'ok',txt:'הכל מסודר השבוע'};
}
function nextUp(){
  for(const a of state.acts) for(const s of a.sessions){
    if(s.week!==0) continue;
    const d=dayStatus(s); if(d.k==='none') continue;
    return {a,s,d};
  }
  return null;
}

        <span class="hval">${driving?'מסיעים':'לא מסיעים'}</span>
        <span class="seatnote">${seats}</span></span>
      <span class="dlegs">
        <span class="leg ${m.to?'on':''}"   data-a="leg" data-i="${a.id}" data-s="${s.id}" data-d="to">הלוך</span>
        <span class="leg ${m.from?'on':''}" data-a="leg" data-i="${a.id}" data-s="${s.id}" data-d="from">חזור</span>
      </span></button>`;

  const marks=[...(s.oneOff?['חד־פעמי']:[]),...changed(a,s)]
    .map(x=>`<span class="tag warn">${x}</span>`).join('');
  const head=`<div class="dayhead">
      <div class="dh1"><span class="dow">יום ${DOW[s.dow]}</span><span class="dt">${s.date}</span>${marks}
        <button class="kebab" data-a="ctx" data-i="${a.id}" data-s="${s.id}">⋮</button></div>
      <div class="dh2">${sT1(a,s)} · ${sT2(a,s)} · ${sPlace(a,s) ? `<b>${esc(sPlace(a,s))}</b>`
        : s.cancelled ? '—' : '<b class="nop">⚠ מיקום לא נקבע</b>'}
        ${s.note?` · ${esc(s.note)}`:''}</div></div>`;

  if(s.cancelled) return `<div class="day off">${head}
    <div class="strip none"><span class="dot"></span>
      <span class="txt">המפגש בוטל${s.cancelled===true?'':' · '+esc(s.cancelled)}</span></div></div>`;

  return `<div class="day ${open?'open':''}">${head}
    <div class="halves">${kidHalf}${driveHalf}</div>
    <button class="strip ${d.k}" data-a="toggle" data-s="${s.id}">

function detailHTML(a,s,d){
  const blk=(dir,title,time)=>{
    const st=dir==='to'?d.to:d.fr, {cars,waiting,riders}=st.a;
    let h=`<div class="legblock"><div class="legttl">${title} · ${time}</div>`;
    if(!riders.length) return h+`<div style="font-size:13.5px;color:#9aa3af">אין ילדים רשומים</div></div>`;
    if(!cars.length) h+=`<div class="empty">⚠ אין הסעה · ${riders.length} ילדים ממתינים</div>`;
    h+=cars.map(c=>`<div class="car ${c.mine?'mine':''}"><span class="av">${c.mine?'★':esc(c.by[0])}</span>
      <span class="cinfo"><span class="cnm">${c.mine?'אני':esc(c.by)} <em>· ${c.free} מקומות פנויים</em></span>
      <span class="pax">${c.pax.map(p=>(KIDS[p]===ME?`<b>${esc(p)}</b>`:esc(p))).join(' · ')||'—'}</span></span></div>`).join('');
    if(waiting.length) h+=`<div class="wait">⚠ ללא הסעה: ${waiting.map(esc).join(', ')}</div>`;
    return h+'</div>';
  };
  let h=blk('to','הלוך',a.t1)+blk('from','חזור',a.t2);
  if(a.unmarked.length) h+=`<div class="unmarked">○ עוד לא סימנו השבוע: ${a.unmarked.map(esc).join(', ')}</div>`;
  if(d.k==='bad') h+=`<button class="shareb" data-a="share" data-i="${a.id}" data-s="${s.id}">💬 לשתף בקשה בקבוצת הוואטסאפ</button>`;
  return h;
}

const EMOJIS=['🏀','⚽','🎾','🏐','🏊','🤸','🥋','🩰','🎹','🎨','🧮','📚','🤖','🧗','♟️'];

const INVITE={by:'',name:'',emoji:'🔗',dow:0,start:'',t2:'',members:[],kids:{}};

const minusMin=(t,n)=>{const[h,m]=t.split(':').map(Number);let x=h*60+m-n;if(x<0)x+=1440;
  return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
const minus15=t=>minusMin(t,15);
const plusMin =(t,n)=>{const[h,m]=t.split(':').map(Number);let x=(h*60+m+n)%1440;
  return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
const whenTxt=(days,s,e)=>{
  const d=[...days].sort().map(x=>DOWL[x]);
  const list=d.length===1?d[0]:d.slice(0,-1).join(', ')+' ו־'+d[d.length-1];
  return (d.length===1?'יום ':'ימי ')+list+' · '+s+'–'+e;
};

const STEPS={create:['details','where','kids','invite'], join:['landing','mail','code','kids']};
const wz=()=>view.wz;

function stepValid(){
  const w=view.wz, k=STEPS[view.kind][view.step];
  if(k==='details') return !!(w.name&&w.name.trim()&&w.days.length&&w.start&&w.end&&w.end>w.start);
  if(k==='where')   return w.placeMode==='varies' || !!(w.placeMode==='fixed'&&w.place);
  if(k==='mail')    return /.+@.+\..+/.test(w.mail||'');
  if(k==='code')    return (w.code||'').length===6;
  return true;
}

function flowHTML(){
  const w=view.wz, steps=STEPS[view.kind], k=steps[view.step];
  const body={details:fDetails,where:fWhere,kids:fKids,invite:fInvite,
              landing:fLanding,mail:fMail,code:fCode}[k](w);
  const last=view.step===steps.length-1;
  const cta=k==='landing'?'להצטרף לחוג':last?'סיום':'המשך';
  return `<div class="top"><button class="iconbtn" data-a="fback">‹</button>
      <h1 style="font-size:16px">${view.kind==='create'?'חוג חדש':'הצטרפות לחוג'}
      <small>שלב ${view.step+1} מתוך ${steps.length}</small></h1></div>
    <div class="prog">${steps.map((_,i)=>`<i class="${i<=view.step?'on':''}"></i>`).join('')}</div>
    ${body}
    <div class="cta"><button class="${stepValid()?'':'off'}" data-a="fnext">${cta}</button>
      ${k==='invite'?'<button class="alt" data-a="fnext">אפשר גם אחר כך</button>':''}
      ${k==='code'?'<button class="alt" data-a="noop">לא הגיע קוד? לשלוח שוב</button>':''}</div>`;
}

/* ---------- טעינת כל מה שהמשתמש רשאי לראות ---------- */
async function loadState(){
  const {data:{user}} = await sb.auth.getUser();
  ME_ID = user.id;

  const [prof, hh, acts] = await Promise.all([
    sb.from('profiles').select('id,name,seats').eq('id',user.id).single(),
    sb.from('household_members').select('household_id'),
    sb.from('activities').select(`
        id,name,emoji,place,weekdays,starts_at,ends_at,pickup_lead_min,invite_token,
        activity_members(user_id,is_admin,profiles(id,name)),
        activity_kids(kid_id,kids(id,name,household_id)),
        join_requests(id,user_id,status,profiles(name))`),
  ]);
  if(prof.error) throw prof.error;
  if(acts.error) throw acts.error;

  const myHouseholds = (hh.data||[]).map(r=>r.household_id);
  const kidsRes = await sb.from('kids').select('id,name,household_id');
  const allKids = kidsRes.data||[];
  const mineKid = k => myHouseholds.includes(k.household_id);

  /* מפגשים של השבועיים הקרובים */
  const from = ymd(dayOf(0)), to = ymd(dayOf(13));
  const ids = (acts.data||[]).map(a=>a.id);
  let sess=[], att=[], off=[], asg=[];
  if(ids.length){
    const r = await sb.from('v_sessions').select('*')
      .in('activity_id', ids).gte('on_date', from).lte('on_date', to).order('on_date');
    sess = r.data||[];
    const sids = sess.map(x=>x.id);
    if(sids.length){
      const [a1,o1,g1] = await Promise.all([
        sb.from('attendance').select('*').in('session_id',sids),
        sb.from('offers').select('*').in('session_id',sids),
        sb.from('assignments').select('*').in('session_id',sids),
      ]);
      att=a1.data||[]; off=o1.data||[]; asg=g1.data||[];
    }
  }

  /* שמות: KIDS ממפה ילד -> שם ההורה, כמו במוקאפ */
  Object.keys(KIDS).forEach(k=>delete KIDS[k]);
  const nameOf = {};
  (acts.data||[]).forEach(a=>(a.activity_members||[]).forEach(m=>{
    if(m.profiles) nameOf[m.user_id] = m.profiles.name || 'הורה';
  }));
  nameOf[user.id] = prof.data.name || 'אני';
  const kidOwner = {};                       /* kid_id -> user_id */
  allKids.forEach(k=>{
    const owner = Object.keys(nameOf).find(uid =>
      uid===user.id ? myHouseholds.includes(k.household_id) : false);
    kidOwner[k.id] = owner || null;
  });

  const hhmAll = await sb.from('household_members').select('household_id,user_id');
  (hhmAll.data||[]).forEach(r=>{
    allKids.filter(k=>k.household_id===r.household_id)
           .forEach(k=>{ kidOwner[k.id] = r.user_id; });
  });
  allKids.forEach(k=>{ KIDS[k.name] = nameOf[kidOwner[k.id]] || '—'; });

  /* הרכבה לצורה שהממשק מכיר */
  state = {
    car: {seats: prof.data.seats},
    household: [{name: prof.data.name||'אני', mail: user.email}],
    kids: allKids.filter(mineKid).map(k=>({
      name: k.name, id: k.id,
      acts: (acts.data||[]).filter(a=>(a.activity_kids||[]).some(ak=>ak.kid_id===k.id)).map(a=>a.id),
    })),
    acts: (acts.data||[]).map(a=>{
      const kidsIn = (a.activity_kids||[]).map(ak=>ak.kids).filter(Boolean);
      const myKids = kidsIn.filter(mineKid).map(k=>k.name);
      const lead = a.pickup_lead_min ?? 15;
      const days = a.weekdays||[];
      const S = sess.filter(x=>x.activity_id===a.id).map(x=>{
        const d = new Date(x.on_date+'T00:00:00');
        const mine = off.find(o=>o.session_id===x.id && o.user_id===user.id);
        const A = {};
        att.filter(t=>t.session_id===x.id && t.attending).forEach(t=>{
          const kid = allKids.find(k=>k.id===t.kid_id); if(kid) A[kid.name]=1;
        });
        return {
          id:x.id, dbId:x.id, dow:d.getDay(), date:dm(d),
          week: d < dayOf(7) ? 0 : 1,
          cancelled: x.cancelled ? (x.cancel_note||true) : false,
          oneOff: x.one_off, note: x.note||undefined,
          origDate: x.orig_date ? dm(new Date(x.orig_date+'T00:00:00')) : undefined,
          start: x.starts_at ? x.starts_at.slice(0,5) : undefined,
          end:   x.ends_at   ? x.ends_at.slice(0,5)   : undefined,
          place: x.place||undefined,
          att: A,
          offers: off.filter(o=>o.session_id===x.id && o.user_id!==user.id && (o.drives_to||o.drives_from))
                     .map(o=>({by:nameOf[o.user_id]||'הורה', to:o.drives_to?1:0,
                               from:o.drives_from?1:0, seats:o.seats})),
          mine: {to: mine?.drives_to?1:0, from: mine?.drives_from?1:0,
                 seats: mine?.seats ?? prof.data.seats},
        };
      }).sort((p,q)=>p.week-q.week || DATES[p.week].indexOf(p.date)-DATES[q.week].indexOf(q.date));

      return {
        id:a.id, name:a.name, emoji:a.emoji||'🏅', place:a.place||'',
        token:a.invite_token,
        weekdays:days, start:(a.starts_at||'').slice(0,5), lead,
        t1: a.starts_at ? minusMin(a.starts_at.slice(0,5), lead) : '',
        t2: (a.ends_at||'').slice(0,5),
        when: days.length ? whenTxt(days,(a.starts_at||'').slice(0,5),(a.ends_at||'').slice(0,5)) : '',
        myKids, unmarked: [],
        members: (a.activity_members||[]).map(m=>({
          n: nameOf[m.user_id]||'הורה', uid:m.user_id, adm: m.is_admin?1:0 })),
        pending: (a.join_requests||[]).filter(j=>j.status==='pending').map(j=>({
          id:j.id, name:(j.profiles?.name)||'הורה', kid:'', mail:'' })),
        sessions: S,
      };
    }),
  };
}

/* ===================== ניווט: מסך + גיליונות + חלוניות =====================
   מחסנית אחת שמגובה ב-History API, כדי שכפתור החזרה של המכשיר
   יסגור שכבה אחת במקום לצאת מהאפליקציה.                                   */
let nav=[];
const layered=()=>nav.filter(e=>e.type!=='act').length;
function navGo(e){ nav.push(e); history.pushState({n:nav.length},''); paint(); }
function navBack(k){ if(nav.length) history.go(-(k||1)); }
function navReplace(e){ if(nav.length) nav[nav.length-1]=e; else nav.push(e); paint(); }
function navCloseLayers(){ const n=layered(); if(n) navBack(n); }
function navReset(e){ nav=[e]; history.replaceState({n:1},''); paint(); }
function paint(){
  const top=nav[nav.length-1];
  if(top && top.type==='flow'){                 /* הזרימה תופסת את כל המסך */
    view.screen='flow'; view.kind=top.kind; view.step=top.step;
    render(); layer.innerHTML=''; window.scrollTo(0,0); return;
  }
  const a=[...nav].reverse().find(e=>e.type==='act');
  view.screen = a?'act':'home';
  if(a) view.actId=a.id;
  render();
  if(top && top.type!=='act') top.draw(); else layer.innerHTML='';
}
/* רענון משאיר state ישן בהיסטוריה בעוד המחסנית מתחילה ריקה — לאפס בסיס */
history.replaceState({n:0},'');
/* go(-k) מפעיל אירוע אחד בלבד, אז מסתנכרנים לפי העומק שנשמר ולא מורידים אחד */
window.addEventListener('popstate',e=>{
  const n = (e.state && e.state.n) || 0;
  if(nav.length > n) nav.length = n;
  paint();
});

function push(fn){ navGo({type:'sheet',draw:fn}); }
function pop(){ navBack(1); }
function redrawTop(){ const t=nav[nav.length-1]; if(t && t.type!=='act') t.draw(); }
function close(){ navCloseLayers(); }
function sheet(title,sub,body){
  layer.innerHTML=`<div class="scrim" data-a="close"><div class="sheet" data-stop><div class="grab"></div>
    <div class="sh-top">${layered()>1?'<button class="sh-back" data-a="pop">‹</button>':''}
    <div class="sh-tt"><h3>${title}</h3>${sub?`<div>${sub}</div>`:''}</div></div>${body}</div></div>`;
}
function modalHTML(html){ layer.innerHTML=`<div class="scrim center" data-a="close"><div class="modal" data-stop>${html}</div></div>`; }
/* חלונית חדשה, או החלפת חלונית קיימת בלי להוסיף צעד להיסטוריה */
function modal(html){
  const draw=()=>modalHTML(html), top=nav[nav.length-1];
  if(top && top.type==='modal') navReplace({type:'modal',draw}); else navGo({type:'modal',draw});
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1900);}

/* ---------- ביטול הסעה ושיתוף ---------- */
function waText(a,s,kind){
  const day='יום '+DOW[s.dow]+' '+s.date;
  if(kind==='cancel') return `ההסעה ב${day} (${a.name}) בוטלה.\nחסרה הסעה — מי יכול להחליף?\n\n👉 בלוח: ${inviteURL(a.token)}`;
  const d=dayStatus(s), miss=[];
  if(d.to.k==='bad') miss.push('הלוך '+a.t1+' — '+d.to.msg);
  if(d.fr.k==='bad') miss.push('חזור '+a.t2+' — '+d.fr.msg);
  const n=Object.keys(s.att).filter(k=>s.att[k]).length;
  return `${a.name} · ${day}\n${miss.join('\n')}\n${n} ילדים רשומים.\nמי יכול?\n\n👉 ${inviteURL(a.token)}`;
}
function shareModal(a,s,kind){
  const t=waText(a,s,kind);
  modal(`<h3>${kind==='cancel'?'ההסעה בוטלה':'בקשת הסעה'}</h3>
    <p>${kind==='cancel'?'הלוח עודכן. כדאי ליידע את הקבוצה כדי שמישהו יספיק להחליף.':'הודעה מוכנה לקבוצת הוואטסאפ של החוג.'}</p>
    <div class="wa">${esc(t)}</div><div class="btns">
      <button class="btn s" data-a="close">לא עכשיו</button>
      <button class="btn g" data-a="wa" data-t="${encodeURIComponent(t)}">שליחה בוואטסאפ</button></div>`);
}
/* עדכון פרטי מפגש — ההודעה קופצת מיד, כי מי שלא ייכנס ללוח לא יידע */
function editShare(a,s,diffs,title){
  const NL = String.fromCharCode(10);
  const t = 'עדכון · ' + a.name + NL
          + 'יום ' + DOW[s.dow] + ' ' + s.date + NL + NL
          + diffs.join(NL)
          + (s.cancelled ? '' : NL + NL + 'הפרטים המעודכנים: ' + sT1(a,s) + '–' + sT2(a,s) + ' · ' + sPlace(a,s))
          + NL + NL + '👉 ' + inviteURL(a.token);
  const html = `<h3>${title||'פרטי המפגש עודכנו'}</h3>
    <p>מי שלא ייכנס ללוח לא ידע שהשתנה משהו. כדאי לשלוח לקבוצה.</p>
    <div class="wa">${esc(t)}</div><div class="btns">
      <button class="btn s" data-a="close">לא עכשיו</button>
      <button class="btn g" data-a="wa" data-t="${encodeURIComponent(t)}">שליחה בוואטסאפ</button></div>`;
  /* מחליף את מה שפתוח במקום לסגור ואז לפתוח — סגירה היא אסינכרונית */
  navReplace({type:'modal', draw:()=>modalHTML(html)});
}

function cancelWarn(aid,sid,dirs){
  const s=sess(aid,sid), pax=new Set();
  dirs.forEach(d=>{const c=assign(s,d).cars.find(c=>c.mine); if(c) c.pax.forEach(p=>{if(KIDS[p]!==ME) pax.add(p);});});
  if(!pax.size){ applyDrive(aid,sid,dirs,0); return; }
  modal(`<h3>⚠ ${pax.size} ילדים משובצים ברכב שלי</h3>
    <p><b>${[...pax].join(', ')}</b> משובצים ליום ${DOW[s.dow]} ${s.date}. ביטול ישאיר אותם בלי הסעה.</p>
    <div class="btns"><button class="btn s" data-a="close">להשאיר</button>
    <button class="btn p" data-a="do-cancel" data-i="${aid}" data-s="${sid}" data-d="${dirs.join(',')}">לבטל בכל זאת</button></div>`);
}
async function applyDrive(aid,sid,dirs,v){
  const s=sess(aid,sid); dirs.forEach(d=>s.mine[d]=v);
  if(v) s.fresh=false;
  render();
  try{
    const to=!!s.mine.to, from=!!s.mine.from;
    const {error} = (to||from)
      ? await sb.from('offers').upsert({session_id:s.id, user_id:ME_ID,
          drives_to:to, drives_from:from, seats:s.mine.seats})
      : await sb.from('offers').delete().eq('session_id',s.id).eq('user_id',ME_ID);
    if(error) throw error;
  }catch(e){ toast('לא נשמר: '+(e.message||e)); }
  reload();
  /* אם נשארנו בלי הסעה — מחליפים את חלונית האזהרה בהודעת השיתוף */
  if(!v && !(s.mine.to||s.mine.from)) shareModal(actById(aid),s,'cancel');
  else { navCloseLayers(); if(v) toast('מסיעים ביום זה'); }
}

async function saveKid(){
  const n=(view.newKid||'').trim();
  if(!n) { toast('צריך שם'); return; }
  if(state.kids.some(k=>k.name===n)) { toast('כבר יש ילד בשם הזה'); return; }
  try{
    const {data:hh} = await sb.from('household_members').select('household_id').limit(1).single();
    const {error} = await sb.from('kids').insert({name:n, household_id:hh.household_id});
    if(error) throw error;
    /* אם מוסיפים מתוך האשף — לצרף אותו מיד לבחירה */
    await loadState();
    if(view.wz && view.screen==='flow'){
      view.wz.kids = [...(view.wz.kids||[]), n];
    }
    pop(); toast(n+' נוסף');
  }catch(e){ toast('נכשל: '+(e.message||e)); }
}


/* יצירת חוג אמיתית — פונקציה אחת בשרת שיוצרת, מצרפת כמנהל ומייצרת מפגשים */
async function finishFlow(){
  const w = view.wz;
  if(view.kind!=='create'){ toast('הצטרפות בקישור — בקרוב'); return; }
  toast('יוצר…');
  try{
    if(w.seats) await sb.from('profiles').update({seats:w.seats}).eq('id',ME_ID);
    const {data:newId, error} = await sb.rpc('create_activity', {
      p_name:   w.name.trim(),
      p_emoji:  w.emoji || '🏅',
      p_weekdays: [...w.days].sort(),
      p_starts: w.start,
      p_ends:   w.end,
      p_until:  w.until || null,
      p_seats:  w.seats || null,
      p_place:  w.placeMode==='varies' ? null : (w.place||null),
    });
    if(error) throw error;
    if((w.kids||[]).length){
      const rows = state.kids.filter(k=>w.kids.includes(k.name))
                             .map(k=>({activity_id:newId, kid_id:k.id}));
      if(rows.length) await sb.from('activity_kids').insert(rows);
    }
    await loadState();
    view.newActToken = (state.acts.find(a=>a.id===newId)||{}).token;
    navReset({type:'act', id:newId});
    toast('החוג נוצר');
  }catch(e){ toast('נכשל: '+(e.message||e)); }
}

/* ===================== אירועים ===================== */
/* קלט טקסט: כותבים למצב בלי לצייר מחדש, כדי לא לאבד פוקוס */
/* הדבקה של קוד שלם לתוך תיבות הספרות */
document.addEventListener('paste',e=>{
  const box=e.target.closest('.code input'); if(!box) return;
  const txt=(e.clipboardData||window.clipboardData).getData('text')||'';
  const d=txt.replace(/\D/g,''); if(!d) return;
  e.preventDefault();
  const arr=[...document.querySelectorAll('.code input')];
  let i=arr.indexOf(box);
  for(const ch of d){ if(i>=arr.length) break; arr[i].value=ch; i++; }
  arr[Math.min(i,arr.length-1)].focus();
  arr[0].dispatchEvent(new Event('input',{bubbles:true}));
});

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-f]'); if(!el) return;
  const f=el.dataset.f;
  if(f==='authMail'){ auth.mail=el.value; return; }
  if(/^ac\d$/.test(f)){
    const arr=[...document.querySelectorAll('.code input')];
    el.value=(el.value||'').replace(/\D/g,'').slice(0,1);
    auth.code=arr.map(x=>x.value).join('');
    if(el.value){ const nx=arr[arr.indexOf(el)+1]; if(nx) nx.focus(); }
    return;
  }
  if(f==='wzPlace'){
    (view.wz=view.wz||{}).place=el.value;
    const b=document.querySelector('.cta button'); if(b) b.classList.toggle('off',!stepValid());
    return;
  }
  if(f==='kidName'){ view.newKid=el.value; return; }
  if(f.startsWith('ed')||f==='exDate'){
    const map={edStart:'start',edEnd:'end',edDate:'date',edPlace:'place',edNote:'note'};
    (view.ed=view.ed||{})[map[f]||f]=el.value; return;
  }
  if(!view.wz) return;
  if(f==='start'&&el.value){                 /* סיום נגרר שעה אחרי ההתחלה */
    view.wz.start=el.value; view.wz.end=plusMin(el.value,60);
    const e2=document.querySelector('[data-f=end]'); if(e2) e2.value=view.wz.end;
    const b=document.querySelector('.cta button'); if(b) b.classList.toggle('off',!stepValid());
    return;
  }
  if(/^c\d$/.test(f)){                       /* תיבות הקוד */
    const d=(el.value||'').replace(/\D/g,'').slice(0,1); el.value=d;
    const arr=[...document.querySelectorAll('.code input')];
    view.wz.code=arr.map(x=>x.value).join('');
    if(d){ const nx=arr[arr.indexOf(el)+1]; if(nx) nx.focus(); }
  } else view.wz[f]=el.value;
  const b=document.querySelector('.cta button'); if(b) b.classList.toggle('off',!stepValid());
});

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  /* קליק בתוך גיליון שאינו על פקד — מטפס החוצה אל הרקע וסוגר בטעות */
  const stop=e.target.closest('[data-stop]');
  if(stop && !stop.contains(el)) return;
  const a=el.dataset.a, id=el.dataset.i, sid=el.dataset.s;
  e.stopPropagation();
  switch(a){
    case 'noop': toast('עוד לא ממומש'); return;
    case 'auth-go':   authGo(); return;
    case 'auth-back': auth.step='mail'; auth.code=''; auth.err=''; render(); return;
    case 'logout':    sb.auth.signOut().then(()=>{ auth={step:'mail',mail:'',code:'',busy:false,err:''}; nav=[]; view.screen='auth'; render(); }); return;
    case 'add-kid': view.newKid=''; push(sAddKid); return;
    case 'kid-save': saveKid(); return;

    /* --- זרימת הצטרפות --- */
    case 'add':
      modal(`<h3>מה עושים?</h3><p>שתי הדרכים להיכנס לחוג — שווה לנסות את שתיהן.</p>
        <div class="btns" style="flex-direction:column">
          <button class="btn p" data-a="flow" data-k="create">ליצור חוג חדש</button>
          <button class="btn s" data-a="flow" data-k="join">לפתוח קישור הזמנה</button>
        </div>`);
      return;
    case 'flow':{
      const k=el.dataset.k;
      view.wz = k==='create' ? {days:[],emoji:'',kids:[],seats:state.car.seats,auto:1,lead:15,
                                start:'16:00',end:'17:00'}
                             : {kids:[],seats:state.car.seats};
      navReset({type:'flow',kind:k,step:0}); return;
    }
    case 'fback': navBack(1); return;
    case 'fnext':{
      if(!stepValid()){ toast('צריך למלא את השדות המסומנים'); return; }
      const steps=STEPS[view.kind];
      if(view.step<steps.length-1){ navGo({type:'flow',kind:view.kind,step:view.step+1}); return; }
      finishFlow(); return;
    }
    case 'f-emoji': view.wz.emoji=el.dataset.v; render(); return;
    case 'f-seats': view.wz.seats=+el.dataset.v; render(); return;
    case 'f-lead':  view.wz.lead=+el.dataset.v; render(); return;
    case 'f-place':{
      const v=el.dataset.v;
      if(v==='__varies'){ Object.assign(view.wz,{placeMode:'varies',place:'',placeOther:0}); }
      else if(v==='__other'){ Object.assign(view.wz,{placeMode:'fixed',place:'',placeOther:1}); }
      else { Object.assign(view.wz,{placeMode:'fixed',place:v,placeOther:0}); }
      render();
      if(view.wz.placeOther) document.querySelector('[data-f=wzPlace]')?.focus();
      return;
    }
    case 'f-auto':  view.wz.auto=!view.wz.auto; render(); return;
    case 'f-day':{
      const d=+el.dataset.v, i=view.wz.days.indexOf(d);
      if(i<0) view.wz.days.push(d); else view.wz.days.splice(i,1);
      render(); return;
    }
    case 'f-kid':{
      const n=el.dataset.v, i=view.wz.kids.indexOf(n);
      if(i<0) view.wz.kids.push(n); else view.wz.kids.splice(i,1);
      render(); return;
    }
    case 'close': close(); return;
    case 'pop': pop(); return;
    case 'back': view.open={}; navBack(1); return;
    case 'open': view.open={}; navGo({type:'act',id}); return;
    case 'toggle': view.open[sid]=!view.open[sid]; render(); return;

    /* הגדרות */
    case 'settings': push(sMain); return;
    case 's-kids':   push(sKids); return;
    case 's-kid':    push((k=>()=>sKid(k))(el.dataset.k)); return;
    case 's-acts':   push(sActs); return;
    case 's-car':    push(sCar); return;
    case 's-acct':   push(sAcct); return;
    case 'act-set':  push((i=>()=>sAct(i))(id)); return;
    case 's-mem':     push((i=>()=>sMem(i))(id)); return;
    case 's-actkids': push((i=>()=>sActKids(i))(id)); return;
    case 's-copy':   push((i=>()=>sCopy(i))(id)); return;
    case 's-invite': push((i=>()=>sInvite(i))(id)); return;
    case 's-member': push(((i,m)=>()=>sMember(i,m))(id,el.dataset.m)); return;
    case 'inv-role': actById(id).inviteRole=el.dataset.r; sInvite(id); return;

    case 'mem-adm':{
      const t=actById(id), m=t.members.find(x=>x.n===el.dataset.m);
      if(!m){ toast('לא נמצא'); return; }
      if(m.adm && adminCount(t)===1){ toast('צריך למנות מנהל נוסף לפני שמורידים את האחרון'); return; }
      try{
        const {error} = await sb.from('activity_members').update({is_admin: !m.adm})
          .eq('activity_id',id).eq('user_id',m.uid);
        if(error) throw error;
        await loadState(); sMember(id,m.n); render();
        toast(m.adm ? m.n+' · חבר/ה בחוג' : m.n+' · מנהל/ת בחוג');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'mem-del':{
      const t=actById(id), name=el.dataset.m, m=mem(t,name);
      if(m.adm&&adminCount(t)===1){ toast('אי אפשר להסיר את המנהל היחיד'); return; }
      modal(`<h3>להסיר את ${esc(name)} מ${esc(t.name)}?</h3>
        <p>הילדים והנסיעות של ${esc(name)} יוסרו מהלוח. אפשר להזמין מחדש בכל שלב.</p>
        <div class="btns"><button class="btn s" data-a="close">ביטול</button>
        <button class="btn p" data-a="do-del" data-i="${id}" data-m="${esc(name)}">להסיר</button></div>`);
      return;
    }
    case 'do-del':{
      const t=actById(id), name=el.dataset.m, m=t.members.find(x=>x.n===name);
      try{
        const {error} = await sb.from('activity_members').delete()
          .eq('activity_id',id).eq('user_id',m.uid);
        if(error) throw error;
        await loadState(); navBack(2); toast(name+' הוסר/ה מהחוג');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'last-admin':
      toast('צריך למנות מנהל אחר לפני יציאה מהחוג'); return;
    case 'ctx':      push(((i,x)=>()=>sCtx(i,x))(id,sid)); return;

    case 'kid-act':{
      const k=state.kids.find(x=>x.name===el.dataset.k);
      const on=k.acts.includes(id);
      try{
        const {error} = on
          ? await sb.from('activity_kids').delete().eq('activity_id',id).eq('kid_id',k.id)
          : await sb.from('activity_kids').insert({activity_id:id, kid_id:k.id});
        if(error) throw error;
        await loadState(); redrawTop(); render();
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'appr': case 'rej':{
      const t=actById(id), p=t.pending[+el.dataset.p];
      if(!p){ toast('הבקשה כבר טופלה'); return; }
      try{
        const {error} = await sb.rpc('approve_request', {p_request:p.id, p_approve: a==='appr'});
        if(error) throw error;
        await loadState(); sAct(id); render();
        toast(a==='appr' ? p.name+' צורף/ה לחוג' : 'הבקשה נדחתה');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }


    /* הריבועים */
    case 'kid':{
      const s=sess(id,sid), k=el.dataset.k;
      const kid=state.kids.find(x=>x.name===k);
      if(!kid){ toast('הילד לא נמצא'); return; }
      const on=!s.att[k];
      if(on) s.att[k]=1; else delete s.att[k];      /* אופטימי, ואז אמת מהשרת */
      s.fresh=false; render();
      toast(k+(on?' · מגיעים ביום זה':' · לא מגיעים ביום זה'));
      try{
        const {error} = on
          ? await sb.from('attendance').upsert({session_id:s.id, kid_id:kid.id,
              attending:true, needs_to:true, needs_from:true, updated_by:ME_ID})
          : await sb.from('attendance').delete().eq('session_id',s.id).eq('kid_id',kid.id);
        if(error) throw error;
      }catch(e){ toast('לא נשמר: '+(e.message||e)); }
      await reload(); return;
    }
    case 'drive':{
      const s=sess(id,sid);
      if(s.mine.to||s.mine.from) cancelWarn(id,sid,['to','from']); else applyDrive(id,sid,['to','from'],1);
      return;
    }
    case 'leg':{
      const s=sess(id,sid), d=el.dataset.d;
      if(s.mine[d]) cancelWarn(id,sid,[d]); else applyDrive(id,sid,[d],1);
      return;
    }
    case 'do-cancel': applyDrive(id,sid,el.dataset.d.split(','),0); return;
    case 'share': shareModal(actById(id),sess(id,sid),'ask'); return;
    case 'wa':{
      const w=window.open('https://wa.me/?text='+el.dataset.t,'_blank');
      close(); if(!w) toast('בהדגמה הקישור לוואטסאפ חסום'); return;
    }

    /* מספרים ומתגים */
    case 'seats':{
      state.car.seats=+el.dataset.v;
      state.acts.forEach(x=>x.sessions.forEach(s=>{ if(!s.customSeats) s.mine.seats=state.car.seats; }));
      sCar(); render();
      const {error} = await sb.from('profiles').update({seats:state.car.seats}).eq('id',ME_ID);
      if(error) toast('לא נשמר: '+error.message);
      return;
    }
    case 'dseats':{
      const s=sess(id,sid);
      s.mine.seats=+el.dataset.v; s.customSeats=true;
      sCtx(id,sid); render();
      if(s.mine.to||s.mine.from){
        const {error} = await sb.from('offers')
          .update({seats:s.mine.seats}).eq('session_id',s.id).eq('user_id',ME_ID);
        if(error) toast('לא נשמר: '+error.message); else reload();
      }
      return;
    }

    /* --- עריכת ימים ושעות --- */
    case 's-days':
      view.ed={days:[...actById(id).weekdays],start:actById(id).start,end:actById(id).t2};
      push((i=>()=>sDays(i))(id)); return;
    case 's-place': view.ed={place:actById(id).place||''}; push((i=>()=>sPlaceDef(i))(id)); return;
    case 'pd-pick':{
      const v=el.dataset.v;
      view.ed.placeOther = v==='__other'?1:0;
      view.ed.place = v==='__other'?'':v;
      sPlaceDef(id);
      if(view.ed.placeOther) document.querySelector('[data-f=edPlace]')?.focus();
      return;
    }
    case 'pd-save':{
      try{
        const {error} = await sb.from('activities').update({place: view.ed.place||null}).eq('id',id);
        if(error) throw error;
        await reload(); pop(); toast('המיקום עודכן');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 's-extra': view.ed={}; push((i=>()=>sExtra(i))(id)); return;
    case 's-edit':{
      const a=actById(id), x=sess(id,sid);
      const wk=DATES.findIndex(w=>w.includes(x.date)), di=wk<0?-1:DATES[wk].indexOf(x.date);
      const iso=di<0?'':'2026-'+String(+x.date.split('.')[1]).padStart(2,'0')+'-'+String(+x.date.split('.')[0]).padStart(2,'0');
      view.ed={date:iso,start:sStart(a,x),end:sT2(a,x),place:sPlace(a,x),note:x.note||''};
      view.ed.was={date:x.date,dow:x.dow,start:sStart(a,x),end:sT2(a,x),
                   place:sPlace(a,x),note:x.note||''};
      push(((i,j)=>()=>sEdit(i,j))(id,sid)); return;
    }
    case 'ed-place':
      const v=el.dataset.v;
      view.ed.placeOther = v==='__other' ? 1 : 0;
      view.ed.place = v==='__other' ? '' : v;
      sEdit(id, sid);
      if(view.ed.placeOther) document.querySelector('[data-f=edPlace]')?.focus();
      return;
    case 'ed-sess-save':{
      const a=actById(id), x=sess(id,sid), e=view.ed, was=e.was;
      if(!e.start||!e.end||e.end<=e.start){ toast('שעת הסיום צריכה להיות אחרי ההתחלה'); return; }
      const nd = e.date ? (()=>{ const d=new Date(e.date+'T00:00:00');
        return {lbl:d.getDate()+'.'+(d.getMonth()+1), dow:d.getDay(), iso:e.date}; })() : null;
      const moved = nd && nd.lbl!==was.date;
      const diffs=[];
      if(moved) diffs.push('📅 תאריך: יום '+DOW[nd.dow]+' '+nd.lbl+'  (היה יום '+DOW[was.dow]+' '+was.date+')');
      if(e.start!==was.start||e.end!==was.end)
        diffs.push('🕒 שעה: '+e.start+'–'+e.end+'  (היה '+was.start+'–'+was.end+')');
      if((e.place||'')!==(was.place||''))
        diffs.push('📍 מיקום: '+(e.place||'לא נקבע')+'  (היה '+(was.place||'לא נקבע')+')');
      if((e.note||'')!==(was.note||'') && e.note) diffs.push('נוסף: '+e.note);
      if(!diffs.length){ pop(); toast('לא השתנה כלום'); return; }
      try{
        const {error} = await sb.rpc('edit_session', {
          p_session: x.id,
          p_date:    moved ? nd.iso : null,
          p_starts:  e.start!==was.start ? e.start : null,
          p_ends:    e.end!==was.end     ? e.end   : null,
          p_place:   (e.place||'')!==(was.place||'') ? (e.place||null) : null,
          p_note:    e.note || null,
        });
        if(error) throw error;
        await loadState(); render();
        const A = actById(id) || a;
        editShare(A, A.sessions.find(y=>y.id===sid) || x, diffs);
      }catch(err){ toast('נכשל: '+(err.message||err)); }
      return;
    }
    case 'ed-reset':{
      try{
        const {error} = await sb.rpc('reset_session', {p_session: sid});
        if(error) throw error;
        await reload(); pop(); toast('הוחזר לברירת המחדל');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'cancel-sess':{
      const a=actById(id), x=sess(id,sid);
      if(x.cancelled){
        try{ const {error}=await sb.rpc('cancel_session',{p_session:x.id,p_cancel:false,p_note:null});
          if(error) throw error; await reload(); pop(); toast('המפגש הוחזר'); }
        catch(e){ toast('נכשל: '+(e.message||e)); }
        return;
      }
      modal(`<h3>לבטל את המפגש?</h3>
        <p>יום ${DOW[x.dow]} ${x.date} · ${esc(a.name)}.<br>
        המפגש יישאר בלוח מסומן כמבוטל, כדי שכל המשפחות יראו את זה.</p>
        <div class="btns"><button class="btn s" data-a="close">ביטול</button>
        <button class="btn p" data-a="do-cancel-sess" data-i="${id}" data-s="${sid}">לבטל את המפגש</button></div>`);
      return;
    }
    case 'do-cancel-sess':{
      const a=actById(id), x=sess(id,sid);
      try{
        const {error} = await sb.rpc('cancel_session', {p_session:x.id, p_cancel:true, p_note:null});
        if(error) throw error;
        await loadState(); render();
        const A = actById(id) || a;
        editShare(A, A.sessions.find(y=>y.id===sid) || x, ['🚫 המפגש בוטל'], 'המפגש בוטל');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'ed-day':{
      const x=+el.dataset.v, i=view.ed.days.indexOf(x);
      if(i<0) view.ed.days.push(x); else view.ed.days.splice(i,1);
      sDays(id||view.actId); return;
    }
    case 'ed-save':{
      const d=view.ed;
      if(!d.days.length){ toast('צריך לבחור לפחות יום אחד'); return; }
      if(!d.start||!d.end||d.end<=d.start){ toast('שעת הסיום צריכה להיות אחרי ההתחלה'); return; }
      try{
        const {error} = await sb.rpc('set_schedule', {
          p_activity:id, p_weekdays:[...d.days].sort(), p_starts:d.start, p_ends:d.end});
        if(error) throw error;
        await reload(); pop(); toast('הימים והשעות עודכנו');
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'ex-add':{
      const v=view.ed.exDate;
      if(!v){ toast('צריך לבחור תאריך'); return; }
      try{
        const {error} = await sb.rpc('add_one_off', {p_activity:id, p_date:v});
        if(error) throw error;
        await reload(); pop();
        const d=new Date(v+'T00:00:00');
        toast('נוסף מפגש ביום '+DOW[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1));
      }catch(e){ toast('נכשל: '+(e.message||e)); }
      return;
    }
    case 'auto-att': toast('כללים חוזרים — בקרוב'); return;
    case 'rec-att': toast('כללים חוזרים — בקרוב'); return;
    case 'rec-drive': toast('כללים חוזרים — בקרוב'); return;
    case 'self': toast('כללים חוזרים — בקרוב'); return;
  }
});
boot();
sb.auth.onAuthStateChange((e)=>{ if(e==='SIGNED_OUT'){ view.screen='auth'; render(); } });
</script>
</body>
</html>
